rules:
  - id: express-mongodb-operator-injection
    languages: [js, ts]
    severity: ERROR
    mode: taint
    message: >-
      A value from `req.body` or `req.query` goes into a MongoDB query filter without
      being forced to a string. JSON bodies, and query strings parsed by `qs`, can carry
      objects, so a client can send `{"password": {"$ne": null}}` and the filter matches
      any password. That is a login bypass on a `findOne` and a data leak or mass delete
      on `find` and `deleteMany`. To fix it, cast each value to the type you expect
      before it reaches the filter (`String(req.body.email)`), validate the body with a
      schema, or strip `$` keys with a sanitizer such as `express-mongo-sanitize`.
      Mongoose's `sanitizeFilter` option also blocks this. The rule only recognises a
      schema defined in the same file, so if yours is imported, add a `nosemgrep`
      comment that names it.
    metadata:
      category: security
      subcategory: [vuln]
      cwe:
        - "CWE-943: Improper Neutralization of Special Elements in Data Query Logic"
      owasp:
        - A03:2021 - Injection
        - A05:2025 - Injection
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      technology: [express, mongodb, mongoose]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/NodeJS_Security_Cheat_Sheet.html
        - https://mongoosejs.com/docs/api/mongoose.html#Mongoose.prototype.sanitizeFilter()
        - https://portswigger.net/web-security/nosql-injection
      registry-comparison: >-
        The community registry has no MongoDB or Mongoose injection rule for
        JavaScript or TypeScript. The closest one covers DynamoDB in AWS Lambda. Outside it, njsscan's
        node_nosqli_injection rule tracks request data into findOne() only, treats
        route params as sources, and has no cast, guard or Mongoose sanitizeFilter
        handling.
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: function ... ($REQ, $RES, ...) { ... }
              - pattern-inside: ($REQ, $RES, ...) => { ... }
          # Route params are always strings, so only body and query are sources.
          - pattern-either:
              - pattern: $REQ.body
              - pattern: $REQ.query
    pattern-sanitizers:
      - pattern: String(...)
      - pattern: Number(...)
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: Boolean(...)
      - pattern: $X.toString()
      # String methods throw on an object before the query runs.
      - patterns:
          - pattern: $X.$STRING_METHOD(...)
          - metavariable-regex:
              metavariable: $STRING_METHOD
              regex: ^(toLowerCase|toUpperCase|trim|trimStart|trimEnd|normalize|toLocaleLowerCase|toLocaleUpperCase)$
      - pattern: "`...`"
      # Schema parsers count only for a plain object schema, which drops or rejects
      # unknown keys and checks field types: z.object(...), z.object(...).strict(),
      # z.strictObject(...), or Joi.object(...) with validateAsync(), which throws on
      # invalid input. Chains such as .passthrough(), .loose(), .catchall(),
      # .unknown() or .options() change the outer call and do not match. A schema
      # imported from another file is not recognised.
      - patterns:
          - pattern-either:
              - pattern: $SCHEMA.parse(...)
              - pattern: $SCHEMA.safeParse(...)
              - pattern: $SCHEMA.parseAsync(...)
              - pattern: $SCHEMA.safeParseAsync(...)
          - pattern-either:
              - pattern-inside: |
                  $SCHEMA = $Z.object(...)
                  ...
              - pattern-inside: |
                  $SCHEMA = $Z.object(...).strict()
                  ...
              - pattern-inside: |
                  $SCHEMA = $Z.object(...).strip()
                  ...
              - pattern-inside: |
                  $SCHEMA = $Z.strictObject(...)
                  ...
      - patterns:
          - pattern-either:
              - pattern: $Z.object(...).$PARSE(...)
              - pattern: $Z.object(...).strict().$PARSE(...)
              - pattern: $Z.strictObject(...).$PARSE(...)
          - metavariable-regex:
              metavariable: $PARSE
              regex: ^(parse|safeParse|parseAsync|safeParseAsync)$
      - patterns:
          - pattern: $SCHEMA.validateAsync(...)
          - pattern-either:
              - pattern-inside: |
                  $SCHEMA = Joi.object(...)
                  ...
              - pattern-inside: |
                  $SCHEMA = Joi.object(...).required()
                  ...
          - pattern-not: "$SCHEMA.validateAsync($INPUT, {..., allowUnknown: true, ...})"
      # Yup's validate() is async and rejects invalid input; validateSync() throws.
      # Joi's validate() returns the error instead of throwing, so it only counts
      # through the error check in the sinks below.
      - pattern: "await $SCHEMA.validate($INPUT, {..., stripUnknown: true, ...})"
      - pattern: "$SCHEMA.validateSync($INPUT, {..., stripUnknown: true, ...})"
      - pattern: sanitize(...)
      - pattern: $MONGO_SANITIZE.sanitize(...)
      - pattern: mongoSanitize(...)
      - pattern: $MONGOOSE.sanitizeFilter(...)
      - pattern: sanitizeFilter(...)
      # Casts to ObjectId, Date or arrays of scalars.
      - pattern: new ObjectId(...)
      - pattern: ObjectId(...)
      - pattern: new $MONGOOSE.Types.ObjectId(...)
      - pattern: $MONGOOSE.Types.ObjectId(...)
      - pattern: new Types.ObjectId(...)
      - pattern: new Date(...)
      - pattern: $X.map(String)
      - pattern: $X.map(Number)
      # { $eq: value } matches the value literally, which is what sanitizeFilter produces.
      - pattern: "{ $eq: $V }"
      - pattern: "$X.map(($ITEM) => String($ITEM))"
      - pattern: "$X.map(($ITEM) => Number($ITEM))"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: "$COLLECTION.$METHOD({..., $KEY: $VALUE, ...}, ...)"
              # The whole filter from the request, e.g. deleteMany(req.body). Object
              # literals are handled per property by the pattern above.
              - patterns:
                  - pattern: $COLLECTION.$METHOD($VALUE, ...)
                  - metavariable-pattern:
                      metavariable: $VALUE
                      language: generic
                      pattern-regex: \A[^{]
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(find|findOne|update|remove|findOneAndUpdate|findOneAndDelete|findOneAndReplace|findOneAndRemove|updateOne|updateMany|deleteOne|deleteMany|replaceOne|countDocuments|exists)$
          # Sequelize also has findOne/updateOne-style methods, but its operators are
          # Symbols (Op.ne), so a JSON object cannot inject one. Skip a value that is
          # itself a `where:` clause. Tainted fields next to `where` are still reported.
          - pattern-not-inside: "$COLLECTION.$METHOD({..., where: $VALUE, ...}, ...)"
          - pattern-not-inside: "$COLLECTION.$METHOD($VALUES, {..., where: $WHERE, ...}, ...)"
          # A one-argument update() is a Sequelize or Mongoose instance update, not a filter.
          - pattern-not-inside: $COLLECTION.update($ONLY_ARGUMENT)
          # Mongoose's sanitizeFilter query option strips $ operators.
          - pattern-not-inside: "$COLLECTION.$METHOD($FILTER, $PROJECTION, {..., sanitizeFilter: true, ...})"
          # A guard that rejects the request before the query is a fix: a typeof check,
          # an ObjectId check or an allowlist check. The guard can be part of a larger
          # condition, but its body must end in a return or throw at the top level, so
          # a nested or conditional return does not count.
          - pattern-not-inside: |
              if (<... typeof $VALUE !== $TYPE ...>) { return ...; }
              ...
          - pattern-not-inside: |
              if (<... typeof $VALUE !== $TYPE ...>) { $...BEFORE; return ...; }
              ...
          - pattern-not-inside: |
              if (<... typeof $VALUE !== $TYPE ...>) { throw $ERROR; }
              ...
          - pattern-not-inside: |
              if (<... typeof $VALUE !== $TYPE ...>) { $...BEFORE; throw $ERROR; }
              ...
          - pattern-not-inside: |
              if (<... typeof $VALUE != $TYPE ...>) { return ...; }
              ...
          - pattern-not-inside: |
              if (<... typeof $VALUE != $TYPE ...>) { $...BEFORE; return ...; }
              ...
          - pattern-not-inside: |
              if (<... typeof $VALUE != $TYPE ...>) { throw $ERROR; }
              ...
          - pattern-not-inside: |
              if (<... typeof $VALUE != $TYPE ...>) { $...BEFORE; throw $ERROR; }
              ...
          - pattern-not-inside: |
              if (<... !$MONGOOSE.isValidObjectId($VALUE) ...>) { return ...; }
              ...
          - pattern-not-inside: |
              if (<... !$MONGOOSE.isValidObjectId($VALUE) ...>) { $...BEFORE; return ...; }
              ...
          - pattern-not-inside: |
              if (<... !$MONGOOSE.isValidObjectId($VALUE) ...>) { throw $ERROR; }
              ...
          - pattern-not-inside: |
              if (<... !$MONGOOSE.isValidObjectId($VALUE) ...>) { $...BEFORE; throw $ERROR; }
              ...
          - pattern-not-inside: |
              if (<... !$ALLOWED.includes($VALUE) ...>) { return ...; }
              ...
          - pattern-not-inside: |
              if (<... !$ALLOWED.includes($VALUE) ...>) { $...BEFORE; return ...; }
              ...
          - pattern-not-inside: |
              if (<... !$ALLOWED.includes($VALUE) ...>) { throw $ERROR; }
              ...
          - pattern-not-inside: |
              if (<... !$ALLOWED.includes($VALUE) ...>) { $...BEFORE; throw $ERROR; }
              ...
          # Or the query runs only inside a positive type check.
          - pattern-not-inside: |
              if (typeof $VALUE === "string") { ... }
          - pattern-not-inside: |
              if (typeof $VALUE == "string") { ... }
          - pattern-not-inside: |
              if (typeof $VALUE === "number") { ... }
          - pattern-not-inside: |
              if (typeof $VALUE == "number") { ... }
          - pattern-not-inside: |
              if (typeof $VALUE === "boolean") { ... }
          - pattern-not-inside: |
              if (typeof $VALUE == "boolean") { ... }
          # Joi's validate() returns { value, error }. Code that checks the error and
          # stops before the write is a fix. The one-argument form is required, so
          # validate(input, { allowUnknown: true }) does not count.
          - pattern-not-inside: |
              $RESULT = $SCHEMA.validate($INPUT);
              ...
              if (<... error ...>) { return ...; }
              ...
          - pattern-not-inside: |
              $RESULT = $SCHEMA.validate($INPUT);
              ...
              if (<... error ...>) { $...BEFORE; return ...; }
              ...
          - pattern-not-inside: |
              $RESULT = $SCHEMA.validate($INPUT);
              ...
              if (<... error ...>) { throw $ERROR; }
              ...
          - pattern-not-inside: |
              $RESULT = $SCHEMA.validate($INPUT);
              ...
              if (<... error ...>) { $...BEFORE; throw $ERROR; }
              ...
          - pattern-not-inside: |
              $RESULT = $SCHEMA.validate($INPUT);
              ...
              if (<... $RESULT.error ...>) { return ...; }
              ...
          - pattern-not-inside: |
              $RESULT = $SCHEMA.validate($INPUT);
              ...
              if (<... $RESULT.error ...>) { $...BEFORE; return ...; }
              ...
          - pattern-not-inside: |
              $RESULT = $SCHEMA.validate($INPUT);
              ...
              if (<... $RESULT.error ...>) { throw $ERROR; }
              ...
          - pattern-not-inside: |
              $RESULT = $SCHEMA.validate($INPUT);
              ...
              if (<... $RESULT.error ...>) { $...BEFORE; throw $ERROR; }
              ...
              if (<... error ...>) { $...BEFORE; return ...; }
              ...
          - focus-metavariable: $VALUE
