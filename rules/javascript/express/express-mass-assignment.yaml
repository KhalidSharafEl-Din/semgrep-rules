rules:
  - id: express-mass-assignment
    languages: [js, ts]
    severity: WARNING
    mode: taint
    message: >-
      The whole request body reaches a database write. A client can add fields the form
      never shows, such as `role`, `isAdmin`, `ownerId`, `balance` or `emailVerified`, and
      the ORM saves them. To fix it, copy only the fields this endpoint may change, for
      example `const { name, email } = req.body; await User.create({ name, email });`,
      or parse the body with a schema that drops unknown keys, such as zod's
      `schema.parse(req.body)` or express-validator's `matchedData(req)`. The rule only recognises a schema defined in the same file, so if yours is imported, add a `nosemgrep` comment that names it.
    metadata:
      category: security
      subcategory: [vuln]
      cwe:
        - "CWE-915: Improperly Controlled Modification of Dynamically-Determined Object Attributes"
      owasp:
        - A08:2021 - Software and Data Integrity Failures
        - A01:2025 - Broken Access Control
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [express, mongoose, sequelize, prisma]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Mass_Assignment_Cheat_Sheet.html
        - https://owasp.org/API-Security/editions/2023/en/0xa3-broken-object-property-level-authorization/
        - https://mongoosejs.com/docs/api/model.html#Model.create()
        - https://www.prisma.io/docs/orm/reference/prisma-client-reference#create
      registry-comparison: >-
        The closest community rules, express-data-exfiltration and
        insecure-object-assign, flag `Object.assign` with request data. Neither tracks
        `req.body` into Mongoose, Sequelize or Prisma writes, and neither treats picked
        fields or schema parsing as a fix.
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: function ... ($REQ, $RES, ...) { ... }
              - pattern-inside: ($REQ, $RES, ...) => { ... }
          - pattern: $REQ.body
    pattern-sanitizers:
      - pattern: $REQ.body.$FIELD
      - pattern: $REQ.body[$KEY]
      - pattern: $LODASH.pick(...)
      - pattern: pick(...)
      # Schema parsers count only when the schema is defined in this file as a plain
      # object schema, which drops or rejects unknown keys: z.object(...),
      # z.object(...).strict(), z.strictObject(...) or Joi.object(...). Chains such
      # as .passthrough(), .loose(), .catchall(), .unknown() or .options() change the
      # outer call and do not match. A schema imported from another file is not
      # recognised, so suppress that finding with a nosemgrep comment.
      - patterns:
          - pattern-either:
              - pattern: $SCHEMA.parse(...)
              - pattern: $SCHEMA.safeParse(...)
              - pattern: $SCHEMA.parseAsync(...)
              - pattern: $SCHEMA.safeParseAsync(...)
          - pattern-either:
              - pattern-inside: |
                  $SCHEMA = $Z.object(...)
                  ...
              - pattern-inside: |
                  $SCHEMA = $Z.object(...).strict()
                  ...
              - pattern-inside: |
                  $SCHEMA = $Z.object(...).strip()
                  ...
              - pattern-inside: |
                  $SCHEMA = $Z.strictObject(...)
                  ...
      - patterns:
          - pattern-either:
              - pattern: $SCHEMA.validate(...)
              - pattern: $SCHEMA.validateAsync(...)
          - pattern-inside: |
              $SCHEMA = Joi.object(...)
              ...
          - pattern-not: "$SCHEMA.$VALIDATE($INPUT, {..., allowUnknown: true, ...})"
      # Yup and Joi drop unknown keys when told to.
      - pattern: "$SCHEMA.validate($INPUT, {..., stripUnknown: true, ...})"
      - pattern: "$SCHEMA.validateSync($INPUT, {..., stripUnknown: true, ...})"
      - pattern: matchedData(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              # Mongoose and Sequelize: the whole object as the document or the update.
              - patterns:
                  - pattern-either:
                      - patterns:
                          - pattern: $MODEL.create($DATA, ...)
                          - pattern-not: "$MODEL.create($DATA, {..., fields: $FIELDS, ...})"
                      - pattern: $MODEL.insertMany($DATA, ...)
                      - pattern: $MODEL.build($DATA, ...)
                      - pattern: $MODEL.bulkCreate($DATA, ...)
                      - pattern: new $MODEL($DATA)
                      - patterns:
                          - pattern: "$MODEL.update($DATA, {..., where: $W, ...})"
                          # Sequelize's fields option limits which columns are written.
                          - pattern-not: "$MODEL.update($DATA, {..., fields: $FIELDS, ...})"
                      - pattern: $MODEL.findByIdAndUpdate($ID, $DATA, ...)
                      - pattern: $MODEL.findOneAndUpdate($FILTER, $DATA, ...)
                      - pattern: $MODEL.findOneAndReplace($FILTER, $DATA, ...)
                      - pattern: $MODEL.updateOne($FILTER, $DATA, ...)
                      - pattern: $MODEL.updateMany($FILTER, $DATA, ...)
                      - pattern: $MODEL.replaceOne($FILTER, $DATA, ...)
                      # MongoDB update operators: { $set: req.body }.
                      - patterns:
                          - pattern: "$MODEL.$UPDATE($FILTER, {..., $OPERATOR: $DATA, ...}, ...)"
                          - metavariable-regex:
                              metavariable: $UPDATE
                              regex: ^(findByIdAndUpdate|findOneAndUpdate|updateOne|updateMany)$
                          - metavariable-regex:
                              metavariable: $OPERATOR
                              regex: ^["']?\$(set|setOnInsert)["']?$
                  # Model classes are PascalCase by convention. This keeps unrelated
                  # calls such as stripe.customers.create() out of the results.
                  - metavariable-regex:
                      metavariable: $MODEL
                      regex: ^[A-Z][A-Za-z0-9_]*$
              # An instance loaded from the database, changed, then saved.
              - patterns:
                  - pattern-either:
                      - pattern: $DOC.set($DATA)
                      - pattern: Object.assign($DOC, $DATA)
                  - pattern-inside: |
                      $DOC = await $MODEL.$FIND(...);
                      ...
              # Prisma: the data argument.
              - patterns:
                  - pattern: "$PRISMA.$TABLE.$OP({..., data: $DATA, ...})"
                  - metavariable-regex:
                      metavariable: $OP
                      regex: ^(create|createMany|update|updateMany|upsert)$
          # An object literal that names its fields is the fix. The spread case,
          # { ...req.body }, is handled by the second sink below.
          - metavariable-pattern:
              metavariable: $DATA
              language: generic
              pattern-regex: \A[^{]
          - focus-metavariable: $DATA
      - patterns:
          - pattern-either:
              - pattern: "new $MODEL({..., ...$DATA, ...})"
              - pattern: "$MODEL.$OP({..., ...$DATA, ...}, ...)"
              - pattern: "$MODEL.$OP($FILTER, {..., ...$DATA, ...}, ...)"
          - metavariable-regex:
              metavariable: $MODEL
              regex: ^[A-Z][A-Za-z0-9_]*$
          - focus-metavariable: $DATA
      - patterns:
          - pattern: "$PRISMA.$TABLE.$OP({..., data: {..., ...$DATA, ...}, ...})"
          - metavariable-regex:
              metavariable: $OP
              regex: ^(create|createMany|update|updateMany|upsert)$
          - focus-metavariable: $DATA
