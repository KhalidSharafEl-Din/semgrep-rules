rules:
  - id: jsonwebtoken-verify-callback-ignores-error
    languages: [js, ts]
    severity: ERROR
    message: >-
      The callback passed to `jwt.verify()` never branches on its error argument `$ERR`
      or on the payload before it continues. Logging the error does not count. When the
      signature is wrong, the token has expired or the algorithm is not allowed,
      jsonwebtoken calls the callback with an error and an undefined payload, and this
      code keeps going. If it calls `next()` or returns data, a request with a forged or
      expired token gets through. To fix it, check the error first and stop: `if ($ERR)
      return res.status(401).end();`. The synchronous form, `jwt.verify(token, key,
      options)` inside `try`/`catch`, avoids the mistake.
    metadata:
      category: security
      subcategory: [vuln]
      cwe:
        - "CWE-347: Improper Verification of Cryptographic Signature"
        - "CWE-754: Improper Check for Unusual or Exceptional Conditions"
      owasp:
        - A07:2021 - Identification and Authentication Failures
        - A07:2025 - Authentication Failures
        - A10:2025 - Mishandling of Exceptional Conditions
      confidence: HIGH
      likelihood: MEDIUM
      impact: HIGH
      technology: [jwt, jsonwebtoken, express]
      references:
        - https://github.com/auth0/node-jsonwebtoken#jwtverifytoken-secretorpublickey-options-callback
        - https://datatracker.ietf.org/doc/html/rfc8725
      registry-comparison: >-
        The community jsonwebtoken rules cover hardcoded secrets, the `none` algorithm
        and `jwt.decode()` without `jwt.verify()`. None of them checks whether the
        `jwt.verify()` callback handles its error.
    # Layout:
    # 1. Find jwt.verify() calls with a callback, for each way of importing jsonwebtoken.
    # 2-4. Drop callbacks that handle the error, only act on success, or check the
    #      payload. Each group lists the accepted shapes explicitly. Semgrep matches
    #      syntax, not control flow, so every accepted shape is spelled out.
    # What is left is a callback that can reach the success path on a failed token.
    patterns:
      # 1. jwt.verify(token, key, [options,] callback)
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $JWT = require('jsonwebtoken')
                      ...
                  - pattern-inside: |
                      import $JWT from 'jsonwebtoken'
                      ...
                  - pattern-inside: |
                      import * as $JWT from 'jsonwebtoken'
                      ...
              - pattern-either:
                  - pattern: $JWT.verify($TOKEN, $KEY, function ($ERR, ...) { ... })
                  - pattern: $JWT.verify($TOKEN, $KEY, $OPTIONS, function ($ERR, ...) { ... })
                  - pattern: $JWT.verify($TOKEN, $KEY, ($ERR, ...) => $BODY)
                  - pattern: $JWT.verify($TOKEN, $KEY, $OPTIONS, ($ERR, ...) => $BODY)
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      import { verify } from 'jsonwebtoken'
                      ...
                  - pattern-inside: |
                      const { verify } = require('jsonwebtoken')
                      ...
                  - pattern-inside: |
                      let { verify } = require('jsonwebtoken')
                      ...
                  - pattern-inside: |
                      var { verify } = require('jsonwebtoken')
                      ...
              - pattern-either:
                  - pattern: verify($TOKEN, $KEY, function ($ERR, ...) { ... })
                  - pattern: verify($TOKEN, $KEY, $OPTIONS, function ($ERR, ...) { ... })
                  - pattern: verify($TOKEN, $KEY, ($ERR, ...) => $BODY)
                  - pattern: verify($TOKEN, $KEY, $OPTIONS, ($ERR, ...) => $BODY)
      # 2. Callbacks that handle the error. The condition must be true for every
      #    verification error, so `if (err.name === 'TokenExpiredError')` does not count.
      #    The branch must return, or have an else for the success path. A throw inside
      #    the callback is not accepted: it crashes the process instead of rejecting.
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            if ($ERR) { return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            if ($ERR) { $...BEFORE; return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            if ($ERR) { ... } else { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            if ($ERR || $COND) { return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            if ($ERR || $COND) { $...BEFORE; return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            if ($ERR || $COND) { ... } else { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            if ($COND || $ERR) { return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            if ($COND || $ERR) { $...BEFORE; return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            if ($COND || $ERR) { ... } else { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            if ($ERR != null) { return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            if ($ERR != null) { $...BEFORE; return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            if ($ERR != null) { ... } else { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            if ($ERR !== null) { return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            if ($ERR !== null) { $...BEFORE; return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            if ($ERR !== null) { ... } else { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            if ($ERR !== undefined) { return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            if ($ERR !== undefined) { $...BEFORE; return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            if ($ERR !== undefined) { ... } else { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            $ERR ? $YES : $NO;
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            <... next($ERR, ...) ...>;
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            <... done($ERR, ...) ...>;
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            <... cb($ERR, ...) ...>;
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            <... callback($ERR, ...) ...>;
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            <... reject($ERR, ...) ...>;
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            if ($ERR) { return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            if ($ERR) { $...BEFORE; return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            if ($ERR) { ... } else { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            if ($ERR || $COND) { return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            if ($ERR || $COND) { $...BEFORE; return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            if ($ERR || $COND) { ... } else { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            if ($COND || $ERR) { return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            if ($COND || $ERR) { $...BEFORE; return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            if ($COND || $ERR) { ... } else { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            if ($ERR != null) { return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            if ($ERR != null) { $...BEFORE; return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            if ($ERR != null) { ... } else { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            if ($ERR !== null) { return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            if ($ERR !== null) { $...BEFORE; return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            if ($ERR !== null) { ... } else { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            if ($ERR !== undefined) { return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            if ($ERR !== undefined) { $...BEFORE; return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            if ($ERR !== undefined) { ... } else { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            $ERR ? $YES : $NO;
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            <... next($ERR, ...) ...>;
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            <... done($ERR, ...) ...>;
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            <... cb($ERR, ...) ...>;
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            <... callback($ERR, ...) ...>;
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            <... reject($ERR, ...) ...>;
            ...
          })
      - pattern-not: "$VERIFY(..., ($ERR, ...) => $ERR ? $YES : $NO)"
      - pattern-not: "$VERIFY(..., ($ERR, ...) => next($ERR, ...))"
      - pattern-not: "$VERIFY(..., ($ERR, ...) => done($ERR, ...))"
      - pattern-not: "$VERIFY(..., ($ERR, ...) => cb($ERR, ...))"
      - pattern-not: "$VERIFY(..., ($ERR, ...) => callback($ERR, ...))"
      - pattern-not: "$VERIFY(..., ($ERR, ...) => reject($ERR, ...))"
      # 3. Code that only runs on success: if (!err) { ... } or if (err === null) { ... }.
      #    Semgrep cannot check that nothing after the branch calls next(), so a success
      #    branch followed by an unconditional next() is a known false negative.
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            if (!$ERR) { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            if (!$ERR && $COND) { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            if ($ERR === null) { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            if ($ERR === null && $COND) { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            if ($ERR == null) { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            if ($ERR == null && $COND) { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, ...) {
            ...
            if ($ERR === undefined) { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            if (!$ERR) { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            if (!$ERR && $COND) { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            if ($ERR === null) { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            if ($ERR === null && $COND) { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            if ($ERR == null) { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            if ($ERR == null && $COND) { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, ...) => {
            ...
            if ($ERR === undefined) { ... }
            ...
          })
      # 4. Callbacks that check the payload. On error it is undefined, so a guard such as
      #    if (!payload) return ..., or a success branch such as
      #    if (payload && payload.role === 'admin') { return next(); }, rejects the request too.
      - pattern-not: |
          $VERIFY(..., function ($ERR, $PAYLOAD, ...) {
            ...
            if (!$PAYLOAD) { return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, $PAYLOAD, ...) {
            ...
            if (!$PAYLOAD) { $...BEFORE; return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, $PAYLOAD, ...) {
            ...
            if (!$PAYLOAD) { ... } else { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, $PAYLOAD, ...) {
            ...
            if (!$PAYLOAD || $COND) { return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, $PAYLOAD, ...) {
            ...
            if (!$PAYLOAD || $COND) { $...BEFORE; return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, $PAYLOAD, ...) {
            ...
            if (!$PAYLOAD || $COND) { ... } else { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, $PAYLOAD, ...) {
            ...
            if ($PAYLOAD) { return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, $PAYLOAD, ...) {
            ...
            if ($PAYLOAD) { $...BEFORE; return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, $PAYLOAD, ...) {
            ...
            if ($PAYLOAD) { ... } else { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, $PAYLOAD, ...) {
            ...
            if ($PAYLOAD && $COND) { return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, $PAYLOAD, ...) {
            ...
            if ($PAYLOAD && $COND) { $...BEFORE; return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., function ($ERR, $PAYLOAD, ...) {
            ...
            if ($PAYLOAD && $COND) { ... } else { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, $PAYLOAD, ...) => {
            ...
            if (!$PAYLOAD) { return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, $PAYLOAD, ...) => {
            ...
            if (!$PAYLOAD) { $...BEFORE; return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, $PAYLOAD, ...) => {
            ...
            if (!$PAYLOAD) { ... } else { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, $PAYLOAD, ...) => {
            ...
            if (!$PAYLOAD || $COND) { return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, $PAYLOAD, ...) => {
            ...
            if (!$PAYLOAD || $COND) { $...BEFORE; return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, $PAYLOAD, ...) => {
            ...
            if (!$PAYLOAD || $COND) { ... } else { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, $PAYLOAD, ...) => {
            ...
            if ($PAYLOAD) { return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, $PAYLOAD, ...) => {
            ...
            if ($PAYLOAD) { $...BEFORE; return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, $PAYLOAD, ...) => {
            ...
            if ($PAYLOAD) { ... } else { ... }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, $PAYLOAD, ...) => {
            ...
            if ($PAYLOAD && $COND) { return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, $PAYLOAD, ...) => {
            ...
            if ($PAYLOAD && $COND) { $...BEFORE; return ...; }
            ...
          })
      - pattern-not: |
          $VERIFY(..., ($ERR, $PAYLOAD, ...) => {
            ...
            if ($PAYLOAD && $COND) { ... } else { ... }
            ...
          })
      - pattern-not: "$VERIFY(..., ($ERR, $PAYLOAD, ...) => $PAYLOAD ? $YES : $NO)"
