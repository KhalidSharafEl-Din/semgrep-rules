rules:
  - id: fastapi-ssrf
    languages: [python]
    severity: ERROR
    mode: taint
    options:
      # REGION_HOSTS[region] picks a server-side value; the key is not the URL.
      taint_assume_safe_indexes: true
    message: >-
      A FastAPI request parameter reaches the URL of an outbound HTTP call. An attacker
      can point the server at internal services, cloud metadata endpoints such as
      169.254.169.254, or localhost admin ports, and read the response or trigger side
      effects. To fix it, keep the scheme and host fixed in code and put user input only
      in the path or query, for example
      `httpx.get(f"https://api.example.com/users/{user_id}")`. If users must supply a
      full URL, parse it, compare the hostname against an allowlist, resolve it and
      reject private, loopback and link-local addresses, and disable redirects.
    metadata:
      category: security
      subcategory: [vuln]
      cwe:
        - "CWE-918: Server-Side Request Forgery (SSRF)"
      owasp:
        - A10:2021 - Server-Side Request Forgery (SSRF)
        - A01:2025 - Broken Access Control
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [fastapi, httpx, requests, aiohttp]
      references:
        - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
        - https://fastapi.tiangolo.com/tutorial/query-params/
        - https://owasp.org/Top10/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/
      registry-comparison: >-
        The community registry has SSRF taint rules for Flask and Django with `requests`
        and `urllib` sinks, but no FastAPI SSRF rule. This rule treats FastAPI route
        parameters as sources and adds `httpx` and `aiohttp` sinks, which async FastAPI
        services use more than `requests`.
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  def $FUNC(..., $PARAM, ...): ...
              - pattern-inside: |
                  @$APP.$ROUTE(...)
                  async def $FUNC(..., $PARAM, ...): ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: ^(get|post|put|patch|delete|options|head|api_route|websocket)$
          # Parameters filled by Depends() or Security() come from server code, not the client.
          # Query(), Path(), Body() and Header() parameters stay sources.
          - pattern-not-inside: |
              def $FUNC(..., $PARAM = Depends(...), ...): ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: $TYPE = Depends(...), ...): ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: Annotated[$TYPE, Depends(...)], ...): ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: Annotated[$TYPE, Depends(...)] = $DEFAULT, ...): ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM = Security(...), ...): ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: $TYPE = Security(...), ...): ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: Annotated[$TYPE, Security(...)], ...): ...
          - pattern-not-inside: |
              def $FUNC(..., $PARAM: Annotated[$TYPE, Security(...)] = $DEFAULT, ...): ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM = Depends(...), ...): ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: $TYPE = Depends(...), ...): ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: Annotated[$TYPE, Depends(...)], ...): ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: Annotated[$TYPE, Depends(...)] = $DEFAULT, ...): ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM = Security(...), ...): ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: $TYPE = Security(...), ...): ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: Annotated[$TYPE, Security(...)], ...): ...
          - pattern-not-inside: |
              async def $FUNC(..., $PARAM: Annotated[$TYPE, Security(...)] = $DEFAULT, ...): ...
          - focus-metavariable: $PARAM
    pattern-sanitizers:
      # A literal scheme and host in front of the input keeps the request on that host.
      - patterns:
          - pattern-either:
              - pattern: f"$PREFIX{...}..."
              - pattern: '"$PREFIX" + $REST'
          - metavariable-regex:
              metavariable: $PREFIX
              regex: ^https?://[^/{}]+/
      # A literal scheme and host in a format() template.
      - patterns:
          - pattern: '"$FMT".format(...)'
          - metavariable-regex:
              metavariable: $FMT
              regex: ^https?://[^/{}]+/
      # A path that starts with "/" and a non-slash character, for clients built with
      # base_url. "//host" would be scheme-relative, so it does not count.
      - patterns:
          - pattern-either:
              - pattern: '"$SEP" + $REST'
              - pattern: f"$SEP{...}..."
          - metavariable-regex:
              metavariable: $SEP
              regex: ^/[^/]
      # So does a base URL from server-side configuration (a settings or config
      # attribute, an environment variable, or an UPPER_CASE module constant), as long
      # as a literal "/" follows it. Without the slash, input such as "@evil.example"
      # or a full URL passed to urljoin() can change the host.
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern: f"{$BASE}$SEP{...}..."
                  - metavariable-regex:
                      metavariable: $SEP
                      regex: ^/
              - patterns:
                  - pattern: $BASE + f"$SEP{...}..."
                  - metavariable-regex:
                      metavariable: $SEP
                      regex: ^/
              - patterns:
                  - pattern: $BASE + "$SEP" + $REST
                  - metavariable-regex:
                      metavariable: $SEP
                      regex: ^/
              - patterns:
                  - pattern: '"$FMT".format($BASE, ...)'
                  - metavariable-regex:
                      metavariable: $FMT
                      regex: ^\{\}/
          - metavariable-pattern:
              metavariable: $BASE
              language: generic
              pattern-regex: \A((settings|config|app_settings|cfg)\.[A-Za-z_]\w*|os\.(environ|getenv)(\W.*)?|[A-Z][A-Z0-9_]*(\[[^\]]*\])?)\Z
    pattern-sinks:
      - patterns:
          - pattern-either:
              - patterns:
                  - pattern-either:
                      - pattern: $LIB.$METHOD($URL, ...)
                      - pattern: $LIB.$METHOD(..., url=$URL, ...)
                  - metavariable-regex:
                      metavariable: $LIB
                      regex: ^(requests|httpx)$
                  - metavariable-regex:
                      metavariable: $METHOD
                      regex: ^(get|post|put|patch|delete|head|options|stream)$
              - patterns:
                  - pattern-either:
                      - pattern: $LIB.request($VERB, $URL, ...)
                      - pattern: $LIB.request(..., url=$URL, ...)
                  - metavariable-regex:
                      metavariable: $LIB
                      regex: ^(requests|httpx)$
              - pattern: urllib.request.urlopen($URL, ...)
              - pattern: urllib.request.Request($URL, ...)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          async with $CLIENT_CLASS(...) as $CLIENT:
                            ...
                      - pattern-inside: |
                          with $CLIENT_CLASS(...) as $CLIENT:
                            ...
                      - pattern-inside: |
                          $CLIENT = $CLIENT_CLASS(...)
                          ...
                  - metavariable-regex:
                      metavariable: $CLIENT_CLASS
                      regex: ^(httpx\.AsyncClient|httpx\.Client|aiohttp\.ClientSession|requests\.Session|requests\.session)$
                  - pattern-either:
                      - patterns:
                          - pattern-either:
                              - pattern: $CLIENT.$METHOD($URL, ...)
                              - pattern: $CLIENT.$METHOD(..., url=$URL, ...)
                          - metavariable-regex:
                              metavariable: $METHOD
                              regex: ^(get|post|put|patch|delete|head|options|stream)$
                      - pattern: $CLIENT.request($VERB, $URL, ...)
                      - pattern: $CLIENT.request(..., url=$URL, ...)
          - focus-metavariable: $URL
