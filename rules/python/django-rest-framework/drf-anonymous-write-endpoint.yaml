rules:
  - id: drf-anonymous-write-endpoint
    languages: [python]
    severity: ERROR
    message: >-
      `$VIEW` can update or delete existing objects, and its `permission_classes`
      lets anyone call it without logging in. An empty list or `AllowAny` here
      overrides `DEFAULT_PERMISSION_CLASSES` in settings, so a global
      `IsAuthenticated` does not protect this view. Anyone who can guess an ID can
      change or delete that record. To fix it, require authentication and an object
      check, for example `permission_classes = [IsAuthenticated, IsOwner]` with
      `has_object_permission` comparing `obj.owner` to `request.user`, and filter
      `get_queryset()` by the current user. If the view really must be public, split
      the read actions into a `ReadOnlyModelViewSet`.
    metadata:
      category: security
      subcategory: [vuln]
      cwe:
        - "CWE-862: Missing Authorization"
        - "CWE-639: Authorization Bypass Through User-Controlled Key"
      owasp:
        - A01:2021 - Broken Access Control
        - A01:2025 - Broken Access Control
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [django, django-rest-framework]
      references:
        - https://www.django-rest-framework.org/api-guide/permissions/#setting-the-permission-policy
        - https://www.django-rest-framework.org/api-guide/permissions/#allowany
        - https://owasp.org/API-Security/editions/2023/en/0xa1-broken-object-level-authorization/
      registry-comparison: >-
        The community registry has one Django REST Framework rule, about throttling.
        Nothing checks permission classes. This rule skips create-only views such as
        sign-up endpoints, where `AllowAny` is normal, and reports only views that
        modify or delete existing objects.
    pattern-either:
      - patterns:
          - pattern-inside: |
              class $VIEW(..., $BASE, ...):
                ...
          - metavariable-pattern:
              metavariable: $BASE
              language: generic
              pattern-regex: (^|\.)(ModelViewSet|UpdateAPIView|DestroyAPIView|RetrieveUpdateAPIView|RetrieveDestroyAPIView|RetrieveUpdateDestroyAPIView|UpdateModelMixin|DestroyModelMixin)$
          # Views that set http_method_names usually narrow themselves to read methods.
          # The rule skips them without reading the list, which can miss a view that
          # lists "delete" explicitly.
          - pattern-not-inside: |
              class $VIEW(...):
                ...
                http_method_names = $METHODS
                ...
          # A custom get_permissions() decides access at runtime; this rule cannot see it.
          - pattern-not-inside: |
              class $VIEW(...):
                ...
                def get_permissions(self, ...):
                  ...
          - pattern-either:
              - pattern: permission_classes = []
              - pattern: permission_classes = ()
              - patterns:
                  - pattern-either:
                      - pattern: permission_classes = [$PERM]
                      - pattern: permission_classes = ($PERM,)
                  - metavariable-pattern:
                      metavariable: $PERM
                      language: generic
                      pattern-regex: (^|\.)AllowAny$
      - patterns:
          - pattern-either:
              - pattern: |
                  @api_view([..., "$METHOD", ...])
                  @permission_classes([])
                  def $VIEW(...):
                    ...
              - pattern: |
                  @api_view([..., "$METHOD", ...])
                  @permission_classes(())
                  def $VIEW(...):
                    ...
              - patterns:
                  - pattern-either:
                      - pattern: |
                          @api_view([..., "$METHOD", ...])
                          @permission_classes([$PERM])
                          def $VIEW(...):
                            ...
                      - pattern: |
                          @api_view([..., "$METHOD", ...])
                          @permission_classes(($PERM,))
                          def $VIEW(...):
                            ...
                  - metavariable-pattern:
                      metavariable: $PERM
                      language: generic
                      pattern-regex: (^|\.)AllowAny$
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(PUT|PATCH|DELETE)$
