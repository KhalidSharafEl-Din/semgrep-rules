rules:
  - id: gha-untrusted-input-to-github-env
    languages: [yaml]
    severity: ERROR
    message: >-
      This step copies attacker-controlled event data (`$VALUE`) into the environment
      variable `$ENVVAR` and writes a variable to `$GITHUB_ENV` or `$GITHUB_PATH`. Check
      that the written value is `$ENVVAR`, because this rule cannot follow the value
      through the script. Moving `${{ }}` into `env:` stops shell injection in this
      step, but it does not stop this. A newline in the value lets an attacker define
      extra variables for every later step in the job, such as `BASH_ENV`,
      `NODE_OPTIONS` or `LD_PRELOAD`, which gives code execution with the job's token
      and secrets. To fix it, do not write event data to `$GITHUB_ENV` or
      `$GITHUB_PATH`. Pass the value to later steps as an `env:` entry or a step output
      instead. If you must use the env file, validate the value against a strict pattern
      in the same step, for example `[[ "$$ENVVAR" =~ ^[A-Za-z0-9._-]+$ ]] || exit 1`,
      then add a `# nosemgrep` comment that names the check. This rule cannot tell
      whether a check is strict.
    metadata:
      category: security
      subcategory: [vuln]
      cwe:
        - "CWE-77: Improper Neutralization of Special Elements used in a Command ('Command Injection')"
      owasp:
        - A03:2021 - Injection
        - A05:2025 - Injection
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      technology: [github-actions]
      references:
        - https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#understanding-the-risk-of-script-injections
        - https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/workflow-commands-for-github-actions#setting-an-environment-variable
        - https://securitylab.github.com/resources/github-actions-untrusted-input/
      registry-comparison: >-
        The community rule run-shell-injection only looks for `${{ }}` inside `run:`.
        It tells developers to move the value into `env:`, which is the exact pattern
        this rule catches when the variable is then written to an environment file.
    patterns:
      - pattern-either:
          - patterns:
              - pattern-inside: "steps: [...]"
              - pattern-inside: |
                  - env:
                      ...
                      $ENVVAR: $VALUE
                      ...
                    ...
          - pattern-inside: |
              jobs:
                ...
                $JOB:
                  ...
                  env:
                    ...
                    $ENVVAR: $VALUE
                    ...
                  ...
      - pattern-inside: "steps: [...]"
      - pattern: "run: $SCRIPT"
      - metavariable-pattern:
          metavariable: $VALUE
          language: generic
          pattern-either:
            - pattern: ${{ ... github.event.issue.title ... }}
            - pattern: ${{ ... github.event.issue.body ... }}
            - pattern: ${{ ... github.event.pull_request.title ... }}
            - pattern: ${{ ... github.event.pull_request.body ... }}
            - pattern: ${{ ... github.event.pull_request.head.ref ... }}
            - pattern: ${{ ... github.event.pull_request.head.label ... }}
            - pattern: ${{ ... github.event.pull_request.head.repo.default_branch ... }}
            - pattern: ${{ ... github.event.comment.body ... }}
            - pattern: ${{ ... github.event.review.body ... }}
            - pattern: ${{ ... github.event.review_comment.body ... }}
            - pattern: ${{ ... github.event.discussion.title ... }}
            - pattern: ${{ ... github.event.discussion.body ... }}
            - pattern: ${{ ... github.event.head_commit.message ... }}
            - pattern: ${{ ... github.event.head_commit.author.name ... }}
            - pattern: ${{ ... github.event.head_commit.author.email ... }}
            - pattern: ${{ ... github.event.commits ... }}
            - pattern: ${{ ... github.event.pages ... }}
            - pattern: ${{ ... github.event.workflow_run.head_branch ... }}
            - pattern: ${{ ... github.event.workflow_run.head_commit.message ... }}
            - pattern: ${{ ... github.event.workflow_run.display_title ... }}
            - pattern: ${{ ... github.head_ref ... }}
      # A write to the env or path file that can carry a variable: a line that expands
      # a variable and appends it, a grouped { ...; } >> write, tee -a, or a heredoc.
      - metavariable-pattern:
          metavariable: $SCRIPT
          language: generic
          pattern-regex: (\$\{?[A-Za-z_][A-Za-z0-9_]*\}?[^\n]*>>\s*"?\$\{?GITHUB_(ENV|PATH))|(\}\s*>>\s*"?\$\{?GITHUB_(ENV|PATH))|(tee\s+(-a|--append)\s+"?\$\{?GITHUB_(ENV|PATH))|(>>\s*"?\$\{?GITHUB_(ENV|PATH)\}?"?\s*<<)
      # Semgrep cannot compare a YAML key with a token inside a generic block, so the
      # link between the env key and the write is a substring check on the script.
      # The test file marks the known false positives with todook.
      - metavariable-comparison:
          comparison: str($ENVVAR) in str($SCRIPT)
