name: pr-preview
on:
  pull_request_target:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  merge-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # ruleid: gha-privileged-trigger-checks-out-pr-code
          ref: refs/pull/${{ github.event.number }}/merge
      - run: npm ci && npm test

  head-sha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ruleid: gha-privileged-trigger-checks-out-pr-code
          ref: ${{ github.event.pull_request.head.sha }}
          # ruleid: gha-privileged-trigger-checks-out-pr-code
          repository: ${{ github.event.pull_request.head.repo.full_name }}

  comment-bot:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/test')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ruleid: gha-privileged-trigger-checks-out-pr-code
          ref: refs/pull/${{ github.event.issue.number }}/head
      - name: Check out with the GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        # ruleid: gha-privileged-trigger-checks-out-pr-code
        run: gh pr checkout "$PR_NUMBER"
      - name: Fetch the pull request ref by hand
        # ruleid: gha-privileged-trigger-checks-out-pr-code
        run: |
          git fetch origin "pull/${PR_NUMBER}/head:pr"
          git switch pr

  base-only:
    runs-on: ubuntu-latest
    steps:
      # ok: gha-privileged-trigger-checks-out-pr-code
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          # ok: gha-privileged-trigger-checks-out-pr-code
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Label the pull request without touching its code
        # ok: gha-privileged-trigger-checks-out-pr-code
        run: gh pr edit "$PR_NUMBER" --add-label needs-review
---
name: deploy-preview
on:
  workflow_run:
    workflows: [pr-ci]
    types: [completed]
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ruleid: gha-privileged-trigger-checks-out-pr-code
          ref: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
      - uses: actions/checkout@v4
        with:
          # ruleid: gha-privileged-trigger-checks-out-pr-code
          ref: ${{ github.event.workflow_run.head_sha }}
---
# A plain pull_request workflow gets a read-only token and no secrets for forks,
# so checking out the pull request head here is the safe pattern.
name: pr-ci
on: pull_request
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # ok: gha-privileged-trigger-checks-out-pr-code
          ref: ${{ github.event.pull_request.head.sha }}
      # ok: gha-privileged-trigger-checks-out-pr-code
      - run: gh pr checkout "$PR_NUMBER"
